name: release

# Publishes a GitHub release for every push to master: the SDK built, tested
# and laid out by `cmake --install` for each system -- the executables with
# the firmware (and libusb on Windows) beside them, the headers and the
# libraries -- one archive each. The tag is made while publishing, named after
# the version in CMakeLists.txt and the commit (0.2.0-a6002ec), so every push
# has one of its own. Release assets do not count against the Actions
# artifact storage.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Queued rather than cancelled: a run already uploading assets has half a
# release on the server, and killing it leaves that behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^project(usb_dvbs2_driver VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then echo 'no version in CMakeLists.txt'; exit 1; fi
          echo "tag=$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs_on: windows-latest
            llvm_arch: x86_64
            libusb_dir: MinGW64
          - name: windows-arm64
            runs_on: windows-11-arm
            llvm_arch: aarch64
            libusb_dir: MinGW-llvm-aarch64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $llvmArch = '${{ matrix.llvm_arch }}'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20251021/llvm-mingw-20251021-ucrt-$llvmArch.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\ -Force
          "C:\llvm-mingw-20251021-ucrt-$llvmArch\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # See ci.yml for where the import library comes from.
      - name: Fetch libusb
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $version = '1.0.29'
          $url = "https://github.com/libusb/libusb/releases/download/v$version/libusb-$version.7z"
          Invoke-WebRequest -Uri $url -OutFile libusb.7z
          7z x libusb.7z -olibusb-bin | Out-Null
          $mingw = Join-Path 'libusb-bin' '${{ matrix.libusb_dir }}'
          if (-not (Test-Path -LiteralPath $mingw -PathType Container)) {
            throw "no ${{ matrix.libusb_dir }} folder in the libusb archive"
          }
          $lib = 'third_party/libusb/lib'
          New-Item -ItemType Directory -Path $lib -Force | Out-Null
          Copy-Item (Join-Path $mingw 'dll/libusb-1.0.dll')      $lib -Force
          Copy-Item (Join-Path $mingw 'static/libusb-1.0.dll.a') $lib -Force
          Copy-Item (Join-Path $mingw 'static/libusb-1.0.a')     $lib -Force
          foreach ($file in 'libusb-1.0.dll', 'libusb-1.0.dll.a', 'libusb-1.0.a') {
            if (-not (Test-Path (Join-Path $lib $file))) {
              throw "$file could not be extracted from libusb"
            }
          }

      - name: Configure
        run: >
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_MAKE_PROGRAM=mingw32-make

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          $name = "usb-dvbs2-driver-${{ needs.version.outputs.tag }}-${{ matrix.name }}"
          cmake --install build --prefix $name
          if ($LASTEXITCODE -ne 0) { throw 'cmake --install failed' }
          # A package missing its daemon, its firmware or its SDK is not one.
          foreach ($file in 'bin/usb-dvbs2-daemon.exe', 'bin/usb-dvbs2.exe',
                            'bin/libusb-1.0.dll', 'bin/firmware/hiremco-it9303.fw',
                            'bin/firmware/hiremco-avl62x1.fw',
                            'include/sdk/usb_dvbs2.h',
                            'include/engine/usb_dvbs2_engine.h',
                            'lib/libusbdvbs2engine.a', 'lib/libusbdvbs2client.a') {
            if (-not (Test-Path (Join-Path $name $file))) {
              throw "the package has no $file"
            }
          }
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: usb-dvbs2-driver-*.zip
          retention-days: 1

  unix:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runs-on: ubuntu-24.04
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
          - name: macos-arm64
            runs-on: macos-14
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: |
          if [ "$(uname)" = Darwin ]; then
            brew install libusb pkg-config
          else
            sudo apt-get update
            sudo apt-get install -y libusb-1.0-0-dev pkg-config
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          name="usb-dvbs2-driver-${{ needs.version.outputs.tag }}-${{ matrix.name }}"
          cmake --install build --prefix "$name"
          for file in bin/usb-dvbs2-daemon bin/usb-dvbs2 \
                      bin/firmware/hiremco-it9303.fw bin/firmware/hiremco-avl62x1.fw \
                      include/sdk/usb_dvbs2.h include/engine/usb_dvbs2_engine.h \
                      lib/libusbdvbs2engine.a lib/libusbdvbs2client.a; do
            if [ ! -e "$name/$file" ]; then echo "the package has no $file"; exit 1; fi
          done
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: usb-dvbs2-driver-*.tar.gz
          retention-days: 1

  publish:
    needs: [version, windows, unix]
    runs-on: ubuntu-latest
    # gh release create writes to this repository, and creates the tag.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Checksums
        working-directory: packages
        run: sha256sum usb-dvbs2-driver-* > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ needs.version.outputs.tag }} packages/*
          --repo ${{ github.repository }}
          --target ${{ github.sha }}
          --title "usb-dvbs2-driver ${{ needs.version.outputs.tag }}"
          --generate-notes
